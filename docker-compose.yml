services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: growthos
      POSTGRES_PASSWORD: growthos
      POSTGRES_DB: growthos
    ports:
      - "5432:5432"
    volumes:
      - growthos_pgdata:/var/lib/postgresql/data

volumes:
  growthos_pgdata:
